version: "3.9"

services:
  redis:
    image: redis:7-alpine
    container_name: llm-switch-redis
    restart: unless-stopped
    network_mode: host
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data

  dgx-gpu-check:
    image: nvidia/cuda:12.4.1-base-ubuntu22.04
    container_name: llm-switch-dgx-gpu-check
    command: ["nvidia-smi"]
    runtime: nvidia
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    profiles: ["dgx-check"]

volumes:
  redis-data:
