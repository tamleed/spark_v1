services:
  redis:
    image: redis:7-alpine
    container_name: llm-switch-redis
    restart: unless-stopped
    ports:
      - "127.0.0.1:6379:6379"
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data

  gateway:
    build:
      context: ..
      dockerfile: docker/Dockerfile.app
    container_name: llm-switch-gateway
    restart: unless-stopped
    network_mode: host
    env_file:
      - /etc/llm-gateway.env
    environment:
      - REDIS_URL=redis://127.0.0.1:6379/0
      - MODELS_YAML_PATH=/app/configs/models.yaml
      - GATEWAY_YAML_PATH=/app/configs/gateway.yaml
      - PYTHONPATH=/app:/app/gateway
    volumes:
      - ../gateway:/app/gateway
      - ../configs:/app/configs
      - /mnt/models:/mnt/models
      - /opt/llm-switchboard/models:/opt/llm-switchboard/models
      - /opt/llm-switchboard/model:/opt/llm-switchboard/model
      - /usr/bin/docker:/usr/bin/docker:ro
      - /var/run/docker.sock:/var/run/docker.sock
    command: ["uvicorn", "gateway.app.main:app", "--host", "127.0.0.1", "--port", "8000"]
    depends_on:
      - redis

  worker:
    build:
      context: ..
      dockerfile: docker/Dockerfile.app
    container_name: llm-switch-worker
    restart: unless-stopped
    network_mode: host
    env_file:
      - /etc/llm-gateway.env
    environment:
      - REDIS_URL=redis://127.0.0.1:6379/0
      - MODELS_YAML_PATH=/app/configs/models.yaml
      - GATEWAY_YAML_PATH=/app/configs/gateway.yaml
      - PYTHONPATH=/app:/app/gateway
    volumes:
      - ../worker:/app/worker
      - ../gateway:/app/gateway
      - ../configs:/app/configs
      - /mnt/models:/mnt/models
      - /opt/llm-switchboard/models:/opt/llm-switchboard/models
      - /opt/llm-switchboard/model:/opt/llm-switchboard/model
      - /var/lib/huggingface:/var/lib/huggingface
      - /usr/bin/docker:/usr/bin/docker:ro
      - /var/run/docker.sock:/var/run/docker.sock
    command: ["python", "-m", "worker.worker"]
    depends_on:
      - redis

  dgx-gpu-check:
    image: nvidia/cuda:12.4.1-base-ubuntu22.04
    container_name: llm-switch-dgx-gpu-check
    command: ["nvidia-smi"]
    runtime: nvidia
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    profiles: ["dgx-check"]

volumes:
  redis-data:
