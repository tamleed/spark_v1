models:
  - name: gpt-oss120
    source:
      type: huggingface_repo
      value: TODO/gpt-oss120-repo-or-local-path
    backend:
      image: nvcr.io/nvidia/vllm:25.11-py3
      port: 8001
      vllm_args:
        - --dtype
        - bfloat16
        - --max-model-len
        - "8192"
    resources:
      hf_cache_dir: /var/lib/huggingface
      models_dir: /mnt/models
    notes: "Replace source.value with real HF repo or local path"

  - name: qwen3-30b
    source:
      type: huggingface_repo
      value: TODO/Qwen/Qwen3-30B
    backend:
      image: nvcr.io/nvidia/vllm:25.11-py3
      port: 8001
      vllm_args:
        - --dtype
        - bfloat16
        - --max-model-len
        - "8192"
    resources:
      hf_cache_dir: /var/lib/huggingface
      models_dir: /mnt/models

  - name: qwen3-235b-4bit
    source:
      type: huggingface_repo
      value: TODO/Qwen/Qwen3-235B-4bit
    quantization:
      method: awq
    backend:
      image: nvcr.io/nvidia/vllm:25.11-py3
      port: 8001
      vllm_args:
        - --quantization
        - awq
        - --max-model-len
        - "4096"
        - --max-num-seqs
        - "1"
    resources:
      hf_cache_dir: /var/lib/huggingface
      models_dir: /mnt/models
    notes: "Tune quantization.method (awq/gptq/etc.) and max-model-len for DGX Spark memory"
